  <rect x="63" y="148" width="29" height="29" fill="#ffffff" rx="2"/>
  <rect x="70" y="155" width="15" height="15" fill="#0f172a" rx="1"/>
  
  <!-- Corner QR marker top-right -->
  <rect x="200" y="140" width="45" height="45" fill="#0f172a" rx="4"/>
  <rect x="208" y="148" width="29" height="29" fill="#ffffff" rx="2"/>
  <rect x="215" y="155" width="15" height="15" fill="#0f172a" rx="1"/>
  
  <!-- Corner QR marker bottom-left -->
  <rect x="55" y="285" width="45" height="45" fill="#0f172a" rx="4"/>
  <rect x="63" y="293" width="29" height="29" fill="#ffffff" rx="2"/>
  <rect x="70" y="300" width="15" height="15" fill="#0f172a" rx="1"/>
  
  <!-- Grid Matrix elements -->
  <rect x="115" y="145" width="15" height="15" fill="#0f172a"/>
  <rect x="140" y="145" width="30" height="15" fill="#0f172a"/>
  <rect x="125" y="170" width="20" height="20" fill="#0f172a"/>
  <rect x="160" y="170" width="25" height="15" fill="#0f172a"/>
  
  <rect x="115" y="200" width="70" height="70" fill="#0f172a" rx="6"/>
  <rect x="123" y="208" width="54" height="54" fill="#ffffff" rx="4"/>
  <text x="150" y="240" fill="#da251c" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle">QRIS</text>
  
  <rect x="200" y="205" width="25" height="20" fill="#0f172a"/>
  <rect x="235" y="235" width="15" height="35" fill="#0f172a"/>
  <rect x="200" y="270" width="40" height="15" fill="#0f172a"/>
  <rect x="120" y="285" width="35" height="15" fill="#0f172a"/>
  <rect x="145" y="310" width="40" height="20" fill="#0f172a"/>
  <rect x="200" y="310" width="45" height="20" fill="#0f172a"/>
  
  <!-- Footer Note -->
  <text x="150" y="365" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Dicetak oleh Tim GA Kantin Kantor</text>
