  <rect x="0" y="35" width="300" height="20" fill="#da251c"/>
  <text x="150" y="36" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="2">QRIS</text>

  <!-- Merchant Info -->
  <text x="150" y="85" fill="#1e293b" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">KANTIN KANTOR SEJAHTERA</text>
  <text x="150" y="105" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">NMID: ID1020030040050</text>
  
  <!-- Simulated QR Pattern -->
  <rect x="40" y="125" width="220" height="220" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Corner QR marker top-left -->
